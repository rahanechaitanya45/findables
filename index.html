<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amazon India Deals &amp; Curated Recommendations | Discover Top Products</title>
    <meta
      name="description"
      content="Discover top curated deals, honest recommendations, and trending finds on Amazon India. Browse electronics, kitchen essentials, student finds, and budget deals under ₹499."
    />
    <meta name="author" content="Amazon Deals Platform" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Amazon India Deals &amp; Curated Recommendations" />
    <meta
      property="og:description"
      content="Discover top curated deals, honest recommendations, and trending finds on Amazon India. Browse electronics, kitchen essentials, student finds, and budget deals under ₹499."
    />
    <meta property="og:site_name" content="Amazon Deals" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Amazon India Deals &amp; Curated Recommendations" />
    <meta
      name="twitter:description"
      content="Discover top curated deals, honest recommendations, and trending finds on Amazon India."
    />

    <!-- Fonts: Plus Jakarta Sans for refined Amazon marketplace display and readable body -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Schema.org WebSite & Organization structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Amazon Deals",
      "alternateName": "Amazon India Deals & Recommendations",
      "url": "https://amazon.in",
      "description": "Independent Amazon India deals and product recommendations curated for smart shoppers.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "/?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body class="bg-[#EAEDED] text-[#0F1111] antialiased selection:bg-[#FF9900] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
