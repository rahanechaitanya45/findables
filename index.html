<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#131921" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Findables — Find Better. Shop Smarter.</title>
    <meta
      name="description"
      content="Findables is your smart shopping discovery platform that brings quality products from multiple e-commerce websites into one place. We filter through countless listings to help you discover top-rated products, trusted choices, and value-for-money deals from platforms like Amazon, Flipkart, Myntra, Meesho, and more."
    />
    <meta name="author" content="Findables" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Findables — Find Better. Shop Smarter." />
    <meta
      property="og:description"
      content="Findables is your smart shopping discovery platform that brings quality products from multiple e-commerce websites into one place. Less searching. Better choices. Smarter shopping."
    />
    <meta property="og:site_name" content="Findables" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Findables — Find Better. Shop Smarter." />
    <meta
      name="twitter:description"
      content="Findables is your smart shopping discovery platform that brings quality products from multiple e-commerce websites into one place. Less searching. Better choices. Smarter shopping."
    />

    <!-- Fonts: Plus Jakarta Sans for refined Amazon marketplace display and readable body -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Schema.org WebSite & Organization structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Findables",
      "alternateName": "Findables — Find Better. Shop Smarter.",
      "url": "https://findables.in",
      "description": "Findables is your smart shopping discovery platform that brings quality products from multiple e-commerce websites into one place. We filter through countless listings to help you discover top-rated products, trusted choices, and value-for-money deals from platforms like Amazon, Flipkart, Myntra, Meesho, and more.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "/?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body class="bg-[#EAEDED] text-[#0F1111] antialiased selection:bg-[#FF9900] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
